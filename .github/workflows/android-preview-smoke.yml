name: Android preview smoke

on:
  push:
    branches: [main]
    paths: [.github/workflows/android-preview-smoke.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-smoke
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and verify the approved preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candy-evidence"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            'https://expo.dev/artifacts/eas/eXvICfMIr5GhfL0pYzCHAx_AF_z_ZkkqvrRVMeHw5i4.apk' \
            --output "$RUNNER_TEMP/candy.apk"
          echo "0f01ecf6f8d3b29bb085a0e456bb49937e04895971b4e0fc6cd99eb2d6cd6679  $RUNNER_TEMP/candy.apk" | sha256sum --check
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/candy.apk" > "$RUNNER_TEMP/candy-evidence/signature.txt"
          "$tools/aapt" dump badging "$RUNNER_TEMP/candy.apk" > "$RUNNER_TEMP/candy-evidence/manifest.txt"
          grep -q "package: name='br.com.candyenglish.app'" "$RUNNER_TEMP/candy-evidence/manifest.txt"
          echo 'Verified the fixed preview hash, signature and package.'

      - name: Prepare an isolated Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$(id -un)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/candy-android"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/candy-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          sdkmanager --licenses < <(printf 'y\n%.0s' {1..100}) > "$RUNNER_TEMP/android-licenses.log"
          if [[ ! -x "$ANDROID_HOME/emulator/emulator" ]]; then
            sdkmanager emulator > "$RUNNER_TEMP/emulator-install.log"
          fi
          emulator -version
          sdkmanager 'system-images;android-35;default;x86_64' > "$RUNNER_TEMP/android-install.log"
          echo no | avdmanager create avd --force --name candy-preview \
            --package 'system-images;android-35;default;x86_64' --device pixel_7 \
            --path "$ANDROID_AVD_HOME/candy-preview.avd"
          emulator -list-avds | grep -Fx candy-preview
          emulator -avd candy-preview -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo "emulator_pid=$!" >> "$GITHUB_ENV"
          for attempt in {1..120}; do
            if ! kill -0 "$!" 2>/dev/null; then
              tail -80 "$RUNNER_TEMP/emulator.log"
              echo 'The emulator process stopped before Android booted.' >&2
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              adb shell input keyevent 82
              exit 0
            fi
            sleep 2
          done
          tail -80 "$RUNNER_TEMP/emulator.log"
          echo 'Android did not finish booting.' >&2
          exit 1

      - name: Install and check the native login without credentials
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb install "$RUNNER_TEMP/candy.apk"
          adb logcat -c
          adb shell am start -W -n br.com.candyenglish.app/.MainActivity
          ready=false
          for attempt in {1..45}; do
            if adb shell uiautomator dump /sdcard/candy-window.xml >/dev/null 2>&1; then
              adb exec-out cat /sdcard/candy-window.xml > "$RUNNER_TEMP/candy-evidence/login.xml"
              if grep -q 'content-desc="Entrar no Candy English"' "$RUNNER_TEMP/candy-evidence/login.xml"; then
                adb exec-out screencap -p > "$RUNNER_TEMP/candy-evidence/launch.png"
                coordinates="$(python3 -c \
                  'import re,sys,xml.etree.ElementTree as E; n=next(n for n in E.parse(sys.argv[1]).iter("node") if n.get("content-desc")=="Entrar no Candy English" and n.get("clickable")=="true" and n.get("package")=="br.com.candyenglish.app"); b=list(map(int,re.findall(r"\d+",n.get("bounds","")))); print((b[0]+b[2])//2,(b[1]+b[3])//2)' \
                  "$RUNNER_TEMP/candy-evidence/login.xml")"
                read -r tap_x tap_y <<< "$coordinates"
                adb shell input tap "$tap_x" "$tap_y"
                continue
              fi
              if grep -q 'ACESSO CANDY ENGLISH' "$RUNNER_TEMP/candy-evidence/login.xml" \
                && grep -q 'Entrar' "$RUNNER_TEMP/candy-evidence/login.xml" \
                && grep -q 'Senha' "$RUNNER_TEMP/candy-evidence/login.xml"; then
                ready=true
                break
              fi
            fi
            sleep 2
          done
          adb exec-out screencap -p > "$RUNNER_TEMP/candy-evidence/login.png"
          adb logcat -d -b crash > "$RUNNER_TEMP/candy-evidence/crash.txt"
          app_pid="$(adb shell pidof br.com.candyenglish.app | tr -d '\r')"
          test -n "$app_pid"
          adb logcat -d -b crash --pid "$app_pid" > "$RUNNER_TEMP/candy-evidence/crash-candy.txt"
          test "$ready" = true
          if grep -q 'FATAL EXCEPTION\|Fatal signal' "$RUNNER_TEMP/candy-evidence/crash-candy.txt"; then
            echo 'A native crash was recorded.' >&2
            exit 1
          fi
          printf '%s\n' 'APK installed; native login rendered; app process alive; no crash recorded.' \
            'No account was used. Authenticated modules, finances and physical devices are not covered.' \
            > "$RUNNER_TEMP/candy-evidence/result.txt"
          cat "$RUNNER_TEMP/candy-evidence/result.txt"

      - name: Collect anonymous emulator diagnostics
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/emulator.log" ]]; then
            cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/candy-evidence/emulator.log"
          fi

      - name: Keep only anonymous smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candy-android-preview-smoke
          path: ${{ runner.temp }}/candy-evidence/
          retention-days: 3
          if-no-files-found: warn

      - name: Stop the disposable emulator
        if: always()
        shell: bash
        run: |
          if [[ -n "${emulator_pid:-}" ]]; then
            kill "$emulator_pid" || true
          fi
